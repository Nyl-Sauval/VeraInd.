<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="corkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond de présentation -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Anneau orbital technologique -->
  <circle cx="400" cy="220" r="130" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="400" cy="220" r="145" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.5" />

  <!-- Icône centrale : Tronc / Chêne-liège & Bouchon stylisé -->
  <g transform="translate(400, 220)">
    <!-- Forme du bouchon en coupe / cylindre noble -->
    <path d="M-55,-60 C-40,-75 40,-75 55,-60 C65,-50 65,50 55,60 C40,75 -40,75 -55,60 C-65,50 -65,-50 -55,-60 Z" 
          fill="url(#corkGrad)" stroke="#fef3c7" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Tête de bouchon supérieure (ellipse) -->
    <ellipse cx="0" cy="-55" rx="50" ry="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <ellipse cx="0" cy="-55" rx="35" ry="10" fill="#fef08a" opacity="0.6"/>

    <!-- Anneaux de croissance du liège (striations d'écorce Suber) -->
    <path d="M-45,-20 Q0,-10 45,-20" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M-48,10 Q0,20 48,10" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M-42,38 Q0,48 42,38" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Feuille de chêne stylisée (Empreinte RSE & Écologie) -->
    <path d="M0,55 C40,40 85,10 80,-35 C65,-30 55,-10 45,-5 C40,-25 25,-40 10,-45 C15,-20 5,0 0,55 Z" 
          fill="url(#leafGrad)" stroke="#a7f3d0" stroke-width="2" opacity="0.95" />
    
    <!-- Nervures de la feuille -->
    <path d="M12,-35 Q30,-10 18,25" fill="none" stroke="#ecfdf5" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M22,-15 Q40,-12 48,-5" fill="none" stroke="#ecfdf5" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Particules d'excellence (Étoiles dorées) -->
    <circle cx="-75" cy="-40" r="4" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="85" cy="-60" r="3" fill="#34d399" filter="url(#glow)"/>
    <circle cx="-65" cy="50" r="3" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- NOM DE L'ENTREPRISE -->
  <text x="400" y="420" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="4">
    SUBER<tspan fill="#34d399">TECH</tspan>
  </text>
  <text x="400" y="455" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="18" fill="#94a3b8" letter-spacing="8">
    INDUSTRIES
  </text>

  <!-- Ligne séparatrice or & émeraude -->
  <line x1="280" y1="480" x2="520" y2="480" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="400" cy="480" r="5" fill="#34d399" />

  <!-- SLOGAN OFFICIEL -->
  <text x="400" y="525" text-anchor="middle" font-family="'Georgia', serif" font-style="italic" font-weight="bold" font-size="22" fill="url(#goldGrad)">
    « L'Excellence du Liège, l'Empreinte de Demain »
  </text>

  <!-- Badge sous-titre de certification -->
  <text x="400" y="560" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="2">
    TECHNOLOGIE DU LIÈGE • TRANSFORMATION ÉCO-CONÇUE • QUALITÉ CRUS D'EXCEPTION
  </text>
</svg>
